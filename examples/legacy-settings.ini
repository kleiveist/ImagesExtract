# Historical INI fixture retained to verify the compatibility loader.
[LOGGER]
logger_folder = true
logging_enabled = false
console_output = true

[Moduls]
ConvertWebp.py = yes
Folders.py = yes
Enhancement.py = yes
TransBack.py = yes
Extract.py = yes
ExtractGray.py = yes
CleanUp.py = yes
Scal.py = yes
Collation.py = yes
#SwapColors.py = no
#Invert.py = no

[Settings]
output_format = .png
enter_confirmation = true
output_folder = image_ext
output_foldes_collation1 = TransBack
output_foldes_collation2 = Enhancement
output_foldes_collation3 = Whitepaper
output_foldes_collation4 = Enhancwhite
output_foldes_collation5 = Enhanclean
output_foldes_collation6 = Transclean
output_foldes_collation7 = Enhwhitclean
#output_foldes_collation8 = Swapcolors
#utput_foldes_collation9 = Invert
tolerance = 10
min_icon_size = 100
kernel_size = 12
iterations = 1
weight_factor = 0.45
dark_threshold_offset = 45
canny_threshold1 = 32
canny_threshold2 = 155
color_levels = 7
abstraction_degree = 2
accuracy = 1
noise_intensity = 10
edge_weight = 0.1
contrast = 1.2
brightness = 1.05
extractsize = 100

[CleanUp]
tolerance_lower = 1
tolerance_upper = 185
collation1 = on
collation2 = on
collation3 = on
collation4 = on
collation5 = on
collation6 = on
collation7 = on
#collation8 = off

[Scaling]
max_upscale = 200
max_downscale = 25
active_scales = 25,50,70,80
; Optional:
; scale_options = 25:25,25;50:50,50;75:75,75;150:150,150

[swap]
src_color_1 = #ffffff
dst_color_1 = #143349
tolerance = 5
