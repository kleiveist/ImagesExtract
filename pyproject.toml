[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ImagesExtract"
version = "0.1.0"
description = "A safe, reproducible recipe-based image extraction pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "kleiveist" },
]
keywords = ["images", "image-processing", "opencv", "pillow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "Pillow>=10.0,<13",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.11,<6",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
images-extract = "images_extract.cli:main"

[project.urls]
Homepage = "https://github.com/kleiveist/ImagesExtract"
Issues = "https://github.com/kleiveist/ImagesExtract/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["images_extract"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
